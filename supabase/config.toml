# Called from the brand site's AI Tip Calculator page in the browser, which
# authenticates with an opaque publishable key rather than a JWT — so JWT
# verification would reject every call. Abuse is bounded by the per-IP rate
# limit inside the function, which reads and writes no tables.
[functions.market-intelligence-tip-advisor]
verify_jwt = false

# Public GET of stored sales-tax rates for the brand site's tax-and-tip
# calculator, read in the browser with no key. The monthly refresh (POST)
# checks the backend key inside the function.
[functions.market-intelligence-sales-tax]
verify_jwt = false
